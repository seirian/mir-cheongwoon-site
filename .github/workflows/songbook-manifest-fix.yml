name: Finalize songbook production API manifest
on:
  push:
    branches: [develop]
    paths: ['.github/workflows/songbook-manifest-fix.yml']
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply explicit API manifest and fail-before-activation guard
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/mir_shared_root_deploy_ci.py');s=p.read_text()
          old='PERSONAL_WEB = "/web"'
          add='''# Songbook APIs must be present in both preview and production releases.
          SONGBOOK_API_FILES = ("api/songbook-search.php", "api/_songbook_localization.php", "api/_songbook_korean_titles.php")
          for endpoint in SONGBOOK_API_FILES:
              if endpoint not in base.API_FILES:
                  base.API_FILES.append(endpoint)

          def songbook_api_smoke(rid: str):
              # Invalid input is deterministic and exercises PHP without external music calls.
              code, body, _ = base.http(CANONICAL_ORIGIN + PREFIX + rid + "/api/songbook-search.php?q=x")
              try:
                  payload = json.loads(body)
              except Exception:
                  payload = {}
              if code != 400 or payload.get("error") != "query":
                  raise base.Stop("Songbook API is missing or invalid; release will not be activated")
              return {"status": code, "invalid_query_rejected": True, "passed": True}

          PERSONAL_WEB = "/web"'''
          assert s.count(old)==1;s=s.replace(old,add,1)
          old='        report["preview_checks"] = preview_smoke(rid)'
          assert s.count(old)==1;s=s.replace(old,old+'\n        report["songbook_api_check"] = songbook_api_smoke(rid)',1)
          p.write_text(s)
          p=Path('scripts/stage-songbook-preview.py');s=p.read_text();s=s.replace('# These additional endpoints belong only to the feature preview, not the production manifest.','# Keep compatibility with older deploy helpers; production also includes these APIs.')
          p.write_text(s)
          Path('tests/songbook-deploy-manifest.test.js').write_text('''import test from 'node:test';
          import assert from 'node:assert/strict';
          import {readFileSync,existsSync} from 'node:fs';
          test('production deploy includes all songbook PHP endpoints and checks them before activation',()=>{
            const source=readFileSync('scripts/mir_shared_root_deploy_ci.py','utf8');
            for(const path of ['api/songbook-search.php','api/_songbook_localization.php','api/_songbook_korean_titles.php']){
              assert.ok(source.includes('"'+path+'"'),path);
              assert.ok(existsSync('server/'+path),path);
            }
            assert.ok(source.includes('base.API_FILES.append(endpoint)'));
            const check=source.indexOf('report["songbook_api_check"] = songbook_api_smoke(rid)');
            assert.ok(check>0 && check<source.indexOf('report["phase"] = "activating"'));
          });
          ''')
          PY
          npm ci --ignore-scripts --no-audit --no-fund
          npm run verify
          npm run check:backend
          git fetch origin develop
          test "$(git rev-parse FETCH_HEAD)" = "$(git rev-parse HEAD)"
          git rm .github/workflows/songbook-manifest-fix.yml
          git add scripts/mir_shared_root_deploy_ci.py scripts/stage-songbook-preview.py tests/songbook-deploy-manifest.test.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(songbook): ship production search APIs and verify before activation'
          git push origin HEAD:develop
          echo "Patched commit: $(git rev-parse HEAD)"
