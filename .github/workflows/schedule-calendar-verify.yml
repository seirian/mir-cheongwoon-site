name: Schedule calendar verification
on:
  push:
    branches: [develop]
    paths: ['supabase/functions/schedule-sync/**', 'tests/schedule-calendar-grid.test.js', '.github/workflows/schedule-calendar-verify.yml']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  calendar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Calendar regression without source or production writes
        run: node --test tests/schedule-calendar-grid.test.js
      - name: Type-check deployed entrypoint with its existing imports
        run: deno check --config supabase/functions/schedule-sync/deno.json --node-modules-dir=auto --no-lock supabase/functions/schedule-sync/index.ts
