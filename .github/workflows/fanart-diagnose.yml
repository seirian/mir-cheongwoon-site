name: Fanart source diagnosis
on:
  push:
    branches: [develop]
    paths: ['.github/workflows/fanart-diagnose.yml']
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Read public article bootstrap, never execute it
        run: |
          mkdir -p fanart-diagnosis
          python - <<'PY'
          import json,re,urllib.request
          from pathlib import Path
          url='https://cafe.naver.com/f-e/cafes/31003156/articles/165311'
          req=urllib.request.Request(url,headers={'User-Agent':'YeopMirMigration/0.3 (+https://mir.yeop.net)','Accept':'text/html'})
          with urllib.request.urlopen(req,timeout=25) as r:
              assert r.status==200
              html=r.read(2000001).decode('utf-8')
          assert len(html)<=2000000
          decoder=json.JSONDecoder();chunks=[]
          for m in re.finditer(r'self\.__next_f\.push\(',html):
              value,end=decoder.raw_decode(html[m.end():])
              assert html[m.end()+end:].lstrip().startswith(')')
              if isinstance(value,list) and len(value)==2 and value[0]==1 and isinstance(value[1],str):chunks.append(value[1])
          text=''.join(chunks)
          Path('fanart-diagnosis/flight.txt').write_text(text)
          Path('fanart-diagnosis/summary.json').write_text(json.dumps({'url':url,'chunks':len(chunks),'bytes':len(text),'has_contentHtml':'contentHtml' in text,'has_article':'article' in text}))
          print({'chunks':len(chunks),'bytes':len(text),'has_contentHtml':'contentHtml' in text})
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fanart-source-diagnosis
          path: fanart-diagnosis/
          retention-days: 7
