name: Fanart source diagnosis
on:
  push:
    branches: [develop]
    paths: ['.github/workflows/fanart-diagnose.yml']
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate a single article request with real menu context
        run: |
          mkdir -p fanart-diagnosis
          php <<'PHP'
          <?php
          require 'server/api/_core.php';
          $client=new \YeopMigration\Client(budget:15);
          try {
            $query=http_build_query(['query'=>'','menuId'=>10,'boardType'=>'L','useCafeId'=>'true','requestFrom'=>'A']);
            $r=$client->request(\YeopMigration\ARTICLE_API.'165311?'.$query,headers:\YeopMigration\naverHeaders());
            $result=\YeopMigration\unwrap(\YeopMigration\parseJson($r['body']));
            $a=$result['article']??[];
            $out=['ok'=>true,'keys'=>array_keys($result),'article_keys'=>array_keys($a),'title'=>$a['subject']??null,'images'=>count(\YeopMigration\articleImages($a))];
          } catch (\Throwable $e) {
            $code=$e->getMessage(); $out=['ok'=>false,'error'=>preg_match('/^[a-z0-9_]+$/D',$code)?$code:'unclassified'];
          }
          $out['trace']=$client->trace;
          file_put_contents('fanart-diagnosis/result.json',json_encode($out,JSON_PRETTY_PRINT|JSON_UNESCAPED_UNICODE));
          echo json_encode($out,JSON_UNESCAPED_UNICODE).PHP_EOL;
          PHP
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fanart-source-diagnosis
          path: fanart-diagnosis/
          retention-days: 7
