name: Policy production verification
on:
  push:
    branches: [feature/privacy-production, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  policy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify version-controlled code
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run verify
          npm run check:backend
      - name: Install isolated browser tooling
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Check withdrawal entry point
        run: deno check --node-modules-dir=none supabase/functions/member-withdrawal/index.ts
      - name: Production UI and synthetic account behavior
        run: |
          VITE_SUPABASE_URL=https://policy-fixture.supabase.co VITE_SUPABASE_ANON_KEY=synthetic-public-key VITE_REVIEW_PREVIEW=false VITE_POLICY_PREVIEW=false npm run dev -- --host 127.0.0.1 --port 5175 >/tmp/policy-production.log 2>&1 &
          for n in $(seq 1 30); do curl -fsS http://127.0.0.1:5175/ >/dev/null && break || sleep 1; done
          python scripts/policy-production-check.py --url http://127.0.0.1:5175/ --out policy-production-report
          python scripts/withdrawal-browser-check.py --account-fixture --url http://127.0.0.1:5175/ --out withdrawal-production-report
      - name: Verify deployed withdrawal rejects unauthenticated requests
        run: |
          python - <<'PY'
          import urllib.request,urllib.error,json
          from pathlib import Path
          req=urllib.request.Request('https://nohboljeugjmtwnvtayu.supabase.co/functions/v1/member-withdrawal',data=b'{}',headers={'Content-Type':'application/json','Origin':'https://mir.yeop.net'})
          try:
              with urllib.request.urlopen(req,timeout=20) as r: status=r.status
          except urllib.error.HTTPError as e: status=e.code
          assert status == 401, status
          Path('withdrawal-production-report/gateway.json').write_text(json.dumps({'unauthenticated_rejected':True,'status':status,'real_accounts_used':False}))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: policy-production-verification
          path: |
            policy-production-report/
            withdrawal-production-report/
          retention-days: 7
