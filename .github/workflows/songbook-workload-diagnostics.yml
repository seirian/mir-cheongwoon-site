name: Songbook workload diagnostics patch
on:
  push:
    branches: [develop]
    paths: ['.github/workflows/songbook-workload-diagnostics.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Preserve authorization and log only public verified workflow metadata
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('supabase/functions/songbook-timeline-sync/index.ts')
          s=p.read_text()
          old="if(!validGithubClaims(claims))return reply(403,{error:'untrusted_workflow'});"
          new="if(!validGithubClaims(claims)){console.warn('songbook_workload_claim_mismatch',JSON.stringify(Object.fromEntries(['repository_id','repository_owner_id','repository','ref','event_name','workflow_ref','job_workflow_ref','runner_environment','run_id','run_attempt'].map(k=>[k,claims[k]]))));return reply(403,{error:'untrusted_workflow'});}"
          assert s.count(old)==1
          p.write_text(s.replace(old,new))
          PY
          git diff --check
          git fetch origin develop
          test "$(git rev-parse HEAD)" = "$(git rev-parse FETCH_HEAD)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add supabase/functions/songbook-timeline-sync/index.ts
          git commit -m 'fix(songbook): log non-secret verified workflow metadata on authorization mismatch'
          git push origin HEAD:develop
