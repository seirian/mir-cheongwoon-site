name: Materialize reviewed promotion changes
on:
  push:
    branches: [feature/promotion-discovery-preview]
    paths: ['.review-patch/**', '.github/workflows/apply-promotion.yml']
permissions:
  contents: write
concurrency:
  group: promotion-source-materialization
  cancel-in-progress: false
jobs:
  apply:
    if: github.ref == 'refs/heads/feature/promotion-discovery-preview'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Verify and apply the locally reviewed source patch
        run: |
          python - <<'PY'
          import base64, hashlib, lzma, pathlib, subprocess
          parts = sorted(pathlib.Path('.review-patch').glob('[0-9][0-9]'))
          if len(parts) != 6:
              raise SystemExit('Expected exactly six transport chunks')
          encoded = ''.join(p.read_text().strip() for p in parts)
          patch = lzma.decompress(base64.b64decode(encoded, validate=True))
          if hashlib.sha256(patch).hexdigest() != '94065b3c90df18316cf35f6b8c5fd16ae5da6fd4a08b0b0ce889a86a44885c20':
              raise SystemExit('Source patch checksum mismatch')
          paths = subprocess.run(['git', 'apply', '--numstat'], input=patch, capture_output=True, check=True).stdout.decode().splitlines()
          for line in paths:
              path = line.split('\t', 2)[2]
              if not (path.startswith(('src/', 'scripts/', 'docs/reviews/', 'tests/', 'server/')) or path == 'vite.config.js'):
                  raise SystemExit('Unexpected patch destination: ' + path)
          subprocess.run(['git', 'apply', '--check'], input=patch, check=True)
          subprocess.run(['git', 'apply'], input=patch, check=True)
          print('Applied SHA256-verified source changes; no production operation.')
          PY
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Generate static artwork from existing approved assets
        run: |
          python -m pip install Pillow==11.3.0
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
          python scripts/generate-promo-assets.py
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run verify && npm run check:backend
      - name: Commit only to the requested feature branch
        run: |
          test "$GITHUB_REF" = refs/heads/feature/promotion-discovery-preview
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -r .review-patch
          git add src scripts docs/reviews tests server vite.config.js public/og public/mir-profile-still.webp
          git commit -m 'feat: implement promotional discovery, performance records and read-only review'
          git push origin HEAD:refs/heads/feature/promotion-discovery-preview
          echo "SOURCE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Browser regression checks with synthetic fixtures
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
          VITE_REVIEW_PREVIEW=true VITE_SUPABASE_URL=https://preview-fixture.supabase.co VITE_SUPABASE_ANON_KEY=local-fixture-public-key npm run dev -- --host 127.0.0.1 > /tmp/vite.log 2>&1 &
          for n in $(seq 1 30); do curl -fsS http://127.0.0.1:5173/ >/dev/null && break || sleep 1; done
          python scripts/promotion-browser-check.py --url http://127.0.0.1:5173/ --out browser-report
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: promotion-initial-browser-review
          path: browser-report
          retention-days: 7
