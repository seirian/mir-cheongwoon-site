name: Policy workbench
on:
  push:
    branches: [feature/privacy-account-review]
    paths: [.github/workflows/policy-workbench.yml]
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Prepare offline verification workspace
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          git archive --format=tar HEAD > source.tar
          tar -czf dependencies.tar.gz node_modules
          cp "$(command -v node)" node24
          git rev-parse HEAD > source-commit.txt
      - uses: actions/upload-artifact@v4
        with:
          name: policy-workbench
          path: |
            source.tar
            dependencies.tar.gz
            node24
            source-commit.txt
          retention-days: 1
