name: Fetch MIR profile GIF

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/fetch-mir-profile-gif.yml

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Download selected GIF
        shell: bash
        run: |
          set -euo pipefail
          url='https://cafeptthumb-phinf.pstatic.net/MjAyNDAyMDdfMTg3/MDAxNzA3MjM3NTE3NTI0.xHkcCZ5wJ-W5-KIApHq85XW3Qcjmj9kEmSK47_fe3Icg.g-rEvI4bpsptHRntqqkWNl78naZ_YNZsGuxi00l8YQYg.GIF/649.gif?type=w1600'
          curl --fail --location --retry 3 --connect-timeout 20 --max-time 120             --user-agent 'Mozilla/5.0'             --referer 'https://cafe.naver.com/'             --output mir-profile-649.gif "$url"
          header="$(head -c 6 mir-profile-649.gif)"
          test "$header" = 'GIF87a' -o "$header" = 'GIF89a'
          test -s mir-profile-649.gif
          file mir-profile-649.gif
          sha256sum mir-profile-649.gif
      - name: Upload GIF artifact
        uses: actions/upload-artifact@v4
        with:
          name: mir-profile-649
          path: mir-profile-649.gif
          if-no-files-found: error
          retention-days: 1
