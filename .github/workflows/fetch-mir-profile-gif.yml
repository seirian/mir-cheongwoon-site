name: Install MIR profile GIF

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/fetch-mir-profile-gif.yml

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download and verify selected GIF
        shell: bash
        run: |
          set -euo pipefail
          url='https://cafeptthumb-phinf.pstatic.net/MjAyNDAyMDdfMTg3/MDAxNzA3MjM3NTE3NTI0.xHkcCZ5wJ-W5-KIApHq85XW3Qcjmj9kEmSK47_fe3Icg.g-rEvI4bpsptHRntqqkWNl78naZ_YNZsGuxi00l8YQYg.GIF/649.gif?type=w1600'
          curl --fail --location --retry 3 --connect-timeout 20 --max-time 120             --user-agent 'Mozilla/5.0'             --referer 'https://cafe.naver.com/'             --output public/mir-profile-live.gif "$url"
          header="$(head -c 6 public/mir-profile-live.gif)"
          test "$header" = 'GIF87a' -o "$header" = 'GIF89a'
          test -s public/mir-profile-live.gif
          file public/mir-profile-live.gif
          sha256sum public/mir-profile-live.gif

      - name: Point MIR page to local GIF
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/pages/MirPage.jsx')
          text = path.read_text(encoding='utf-8')
          old = "const MIR_PROFILE_IMAGE = import.meta.env.BASE_URL + 'mir-profile-site-v2.webp';"
          new = "const MIR_PROFILE_IMAGE = import.meta.env.BASE_URL + 'mir-profile-live.gif';"
          if text.count(old) != 1:
              raise SystemExit('Expected MIR profile image line not found exactly once')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY

      - name: Commit asset and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/fetch-mir-profile-gif.yml
          git add public/mir-profile-live.gif src/pages/MirPage.jsx
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Replace MIR profile image with selected GIF'
          git push origin HEAD:main
