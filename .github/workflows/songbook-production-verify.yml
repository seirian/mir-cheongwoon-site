name: Songbook production verification
on:
  push:
    branches: [feature/songbook, develop]
    paths: ['src/**','scripts/**','tests/**','server/**','supabase/songbook*','supabase/ops/songbook*','supabase/functions/songbook-timeline-sync/**','docs/reviews/songbook-release.md','.github/workflows/songbook-production-verify.yml']
  pull_request:
    branches: [develop, main]
permissions:
  contents: read
jobs:
  production:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: local-test-only
          POSTGRES_DB: songbook_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: local-test-only
      PGDATABASE: songbook_test
      VITE_REVIEW_PREVIEW: 'false'
      VITE_SONGBOOK_PREVIEW: 'false'
      VITE_SUPABASE_URL: https://songbook-test.supabase.co
      VITE_SUPABASE_ANON_KEY: fixture-anon
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Preserve tracked source for reproducible verification
        run: |
          mkdir -p songbook-production-source
          git archive HEAD -o songbook-production-source/repository.tar
          git rev-parse HEAD > songbook-production-source/commit.txt
      - uses: actions/upload-artifact@v4
        with:
          name: songbook-production-source
          path: songbook-production-source/
          retention-days: 3
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.5.4
      - name: Verify source and search parsers
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run verify
          npm run check:backend
          php tests/songbook-search-test.php
          php tests/songbook-platform-search-test.php
          python -m pip install paramiko==5.0.0
          python tests/test_songbook_key_provision.py
          php tests/songbook-localization-test.php
          python scripts/reconcile-songbook-difficulty.py --self-test
          deno check --config supabase/functions/songbook-timeline-sync/deno.json supabase/functions/songbook-timeline-sync/index.ts
      - name: Verify site-admin database permissions in isolated PostgreSQL
        run: |
          psql -v ON_ERROR_STOP=1 -f tests/sql/songbook-admin-bootstrap.sql
          psql -v ON_ERROR_STOP=1 -f supabase/songbook-production.sql
          psql -v ON_ERROR_STOP=1 -f supabase/ops/songbook_admin_access.sql
          psql -v ON_ERROR_STOP=1 -f tests/sql/songbook-admin-assertions.sql
          psql -v ON_ERROR_STOP=1 -c 'CREATE ROLE service_role NOLOGIN BYPASSRLS; GRANT USAGE ON SCHEMA public,auth TO service_role; GRANT SELECT ON public.admins TO service_role;'
          psql -v ON_ERROR_STOP=1 -f supabase/ops/songbook_timeline_sync.sql
          psql -v ON_ERROR_STOP=1 -f tests/sql/songbook-timeline-assertions.sql
          psql -v ON_ERROR_STOP=1 -f supabase/ops/songbook_optional_artist.sql
          psql -v ON_ERROR_STOP=1 -f tests/sql/songbook-optional-artist-assertions.sql
          psql -v ON_ERROR_STOP=1 -f supabase/ops/songbook_review_search.sql
          psql -v ON_ERROR_STOP=1 -f tests/sql/songbook-review-search-assertions.sql
          psql -v ON_ERROR_STOP=1 -f supabase/ops/songbook_deletion.sql
          psql -v ON_ERROR_STOP=1 -f tests/sql/songbook-deletion-assertions.sql
          psql -v ON_ERROR_STOP=1 -f supabase/ops/songbook_usage.sql
          psql -v ON_ERROR_STOP=1 -f tests/sql/songbook-usage-assertions.sql
      - name: Production build and isolated username login browser checks
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
          python -m pip install playwright==1.57.0
          if ! command -v google-chrome && ! command -v chromium; then python -m playwright install --with-deps chromium; fi
          npx vite build --base /_test_release/
          npx vite preview --host 127.0.0.1 --port 4173 --base /_test_release/ > /tmp/songbook-production.log 2>&1 &
          for n in $(seq 1 30); do curl -fsS http://127.0.0.1:4173/_test_release/ >/dev/null && break || sleep 1; done
          python scripts/songbook-production-browser-check.py --url http://127.0.0.1:4173/_test_release/ --out songbook-production-report
          node scripts/build-songbook-review-fixture.mjs /tmp/songbook-review-fixture.html
          python scripts/songbook-review-ui-check.py --fixture /tmp/songbook-review-fixture.html --out songbook-production-report/review
          python scripts/songbook-review-search-check.py --fixture /tmp/songbook-review-fixture.html --out songbook-production-report/review-search
          python scripts/songbook-reference-position-check.py --fixture /tmp/songbook-review-fixture.html --out songbook-production-report/reference
          python scripts/songbook-video-order-check.py --out songbook-production-report/video-order
          python scripts/songbook-platform-production-check.py --url http://127.0.0.1:4173/_test_release/ --out songbook-production-report/platform-production
          python scripts/songbook-deletion-check.py --url http://127.0.0.1:4173/_test_release/ --out songbook-production-report/deletion
          python scripts/songbook-video-presence-check.py --url http://127.0.0.1:4173/_test_release/ --out songbook-production-report/video-presence
          python scripts/songbook-usability-production-check.py --url http://127.0.0.1:4173/_test_release/ --out songbook-production-report/usability-production
          node scripts/build-songbook-check.mjs --fixture
          npx vite preview --config vite.songbook-check.config.js --base /_test_check/ --host 127.0.0.1 --port 4179 > /tmp/songbook-check.log 2>&1 &
          for n in $(seq 1 30); do curl -fsS http://127.0.0.1:4179/_test_check/songbook/ >/dev/null && break || sleep 1; done
          python scripts/songbook-check-browser.py --url http://127.0.0.1:4179/_test_check/ --out songbook-production-report/preview-regression
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: songbook-production-checks
          path: songbook-production-report/
          retention-days: 14
