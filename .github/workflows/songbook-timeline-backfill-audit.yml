name: Songbook timeline backfill audit
on:
  push:
    branches: [develop]
    paths: ['.github/workflows/songbook-timeline-backfill-audit.yml']
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Date-bounded public replay comments including replies
        run: |
          python - <<'PY'
          import json, time, hashlib, urllib.request, urllib.parse, urllib.error, re, html
          from pathlib import Path
          from datetime import datetime, timezone, timedelta
          out=Path('timeline-audit');out.mkdir();logs=[];last=0;now=datetime.now(timezone.utc);start='2025-01-01 00:00:00'
          def fetch(url,args=None):
            global last
            time.sleep(max(0,0.65-(time.monotonic()-last)));last=time.monotonic()
            if args:url+='?'+urllib.parse.urlencode(args)
            for attempt in range(2):
              try:
                with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'MirSongbookTimeline/1.0 (https://mir.yeop.net)','Referer':'https://vod.sooplive.com/','Accept':'application/json'}),timeout=15) as r:
                  raw=r.read(2500001);assert len(raw)<=2500000
                  obj=json.loads(raw);logs.append(r.status);return obj
              except urllib.error.HTTPError as e:
                if e.code in (401,403,429):raise RuntimeError('public_access_'+str(e.code))
                if attempt:raise
              except Exception:
                if attempt:raise
              time.sleep(2)
          def plain(x):
            x=re.sub(r'<(?:script|style)\b[^>]*>.*?</(?:script|style)>','',str(x),flags=re.I|re.S)
            return html.unescape(re.sub(r'<[^>]*>','',re.sub(r'<br\s*/?>','\n',x,flags=re.I))).replace('\r','')
          def minimize(c,parent=''):
            text=plain(c.get('comment',''));times=len(re.findall(r'(?<!\d)\d{1,3}:\d{2}(?::\d{2})?',text))
            # Keep structured timelines only; omit ordinary conversation, user IDs, IPs, profile and badge fields.
            if times<2 and not re.search('[🎵🎶🎤♪♫]',text):return None
            return {'id':str(c.get('c_comment_no') or c.get('p_comment_no')),'parent_id':parent,'text':text[:100000],'author_hash':hashlib.sha256(str(c.get('user_id','')).encode()).hexdigest(),'created_at':c.get('reg_date')}
          inv=[];seen=set();boundary=False
          for page in range(1,41):
            d=fetch('https://chapi.sooplive.co.kr/api/alice427/vods',{'page':page,'per_page':60,'type':'REVIEW','orderby':'reg_date'})
            assert isinstance(d.get('data'),list) and int(d.get('meta',{}).get('current_page',0))==page
            for r in d['data']:
              assert r.get('user_id')=='alice427' and int(r['station_no'])==24957466
              if r['reg_date']<start:boundary=True;continue
              vid=str(r['title_no'])
              if vid in seen:continue
              seen.add(vid);u=r.get('ucc',{})
              inv.append({'id':vid,'channel_id':'alice427','station_no':r['station_no'],'bbs_no':r['bbs_no'],'board_type':r['board_type'],'title':r['title_name'],'uploaded_at':r['reg_date'].replace(' ','T')+'+09:00','duration_seconds':int(u.get('total_file_duration',0))//1000,'public':int(r.get('auth_no',0))==101 and int(u.get('grade',0))==0 and not u.get('paid_ppv',False) and u.get('file_type')=='REVIEW','comment_count':r.get('count',{}).get('comment_cnt',0)})
            if boundary or not d['data'] or page>=d['meta']['last_page']:break
          assert boundary,'date boundary not reached'
          out.joinpath('inventory.json').write_text(json.dumps(inv,ensure_ascii=False,indent=2));reports=[]
          for idx,v in enumerate(inv):
            report={'vod':v,'complete':False,'comments':[],'root_count':0,'reply_count':0,'state':'pending'}
            try:
              if not v['public']:report['state']='restricted';reports.append(report);continue
              if now-datetime.fromisoformat(v['uploaded_at'])<timedelta(days=7):report['state']='waiting_7_days';reports.append(report);continue
              base={'nStationNo':v['station_no'],'nBbsNo':v['bbs_no'],'nTitleNo':v['id'],'bj_id':'alice427','nBoardType':v['board_type'],'nVod':1}
              roots=[];rootids=set();cursor=0;expected=0
              for pageno in range(1,21):
                j=fetch('https://stbbs.sooplive.com/api/bbs_memo_action.php',dict(base,szAction='get',nPageNo=pageno,nOrderNo=1,nLastNo=cursor))
                c=j.get('CHANNEL',{});assert int(c.get('RESULT',0))==1,'comment_result'
                d=c['DATA'];assert d.get('user_data',{}).get('writer_id')=='alice427','comment_channel'
                rows=d.get('list_data',[]);expected=int(d.get('total_cnt',0));assert isinstance(rows,list)
                for r in rows:
                  assert str(r.get('title_no'))==v['id'],'comment_vod'
                  rid=str(r['p_comment_no'])
                  if rid not in rootids:roots.append(r);rootids.add(rid)
                if not d.get('has_more'):break
                assert rows and str(rows[-1]['p_comment_no'])!=str(cursor),'comment_cursor'
                cursor=rows[-1]['p_comment_no']
              else:raise RuntimeError('comment_page_limit')
              assert len(roots)>=expected,'root_count_mismatch'
              report['root_count']=len(roots)
              for r in roots:
                keep=minimize(r)
                if keep:report['comments'].append(keep)
                child_count=int(r.get('c_comment_cnt',0))
                if child_count:
                  j=fetch('https://stbbs.sooplive.com/api/bbs_memo_action.php',dict(base,szAction='get_reply',nParentCommentNo=r['p_comment_no']))
                  c=j.get('CHANNEL',{});assert int(c.get('RESULT',0))==1,'reply_result'
                  d=c['DATA'];children=d.get('list_data',[])
                  assert isinstance(children,list) and not d.get('has_more') and len(children)>=int(d.get('total_cnt',child_count)),'reply_incomplete'
                  for ch in children:
                    assert str(ch.get('p_comment_no'))==str(r['p_comment_no']),'reply_parent'
                    report['reply_count']+=1
                    keep=minimize(ch,str(r['p_comment_no']))
                    if keep:report['comments'].append(keep)
              report['complete']=True;report['state']='collected'
            except Exception as e:report['state']='error';report['error']=str(e)[:180]
            reports.append(report)
            with out.joinpath('vods.jsonl').open('a') as f:f.write(json.dumps(report,ensure_ascii=False)+'\n')
            if idx%30==0:print('processed',idx+1,'/',len(inv),'complete',sum(x['complete'] for x in reports),flush=True)
            if report.get('error','').startswith('public_access_'):break
          out.joinpath('summary.json').write_text(json.dumps({'at':now.isoformat(),'inventory':len(inv),'pages':page,'completed':sum(r['complete'] for r in reports),'states':{s:sum(r['state']==s for r in reports) for s in sorted(set(r['state'] for r in reports))},'requests':len(logs),'structured_comments':sum(len(r['comments']) for r in reports),'errors':[{'id':r['vod']['id'],'error':r.get('error')} for r in reports if r['state']=='error']},ensure_ascii=False,indent=2))
          print(out.joinpath('summary.json').read_text())
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: songbook-timeline-audit
          path: timeline-audit/
          retention-days: 7
