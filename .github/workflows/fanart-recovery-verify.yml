name: Fanart recovery verification
on:
  push:
    branches: [develop]
    paths: ['server/api/**', 'supabase/functions/fanart-daily-recovery/**', 'supabase/ops/fanart_recovery*', 'tests/fanart-recovery*', 'scripts/fanart-daily-retry-check.php', '.github/workflows/fanart-recovery-verify.yml']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: fixture-only
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Offline policy, source budget and snapshot regression
        run: |
          php -l server/api/_fanart_daily.php
          php -l server/api/naver-fanart-daily.php
          php scripts/fanart-daily-check.php
          php scripts/fanart-daily-retry-check.php
          node --test tests/fanart-recovery.test.js
          deno check supabase/functions/fanart-daily-recovery/index.ts
      - name: Isolated PostgreSQL schema, RLS, phase uniqueness and compare-and-set
        env:
          PGHOST: localhost
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: fixture-only
        run: |
          psql -v ON_ERROR_STOP=1 -c 'create role anon; create role authenticated; create role service_role bypassrls;'
          psql -v ON_ERROR_STOP=1 -f supabase/ops/fanart_recovery.sql
          psql -v ON_ERROR_STOP=1 -f supabase/ops/fanart_recovery.sql
          psql -v ON_ERROR_STOP=1 <<'SQL'
          do $$
          declare n integer;
          begin
            if has_table_privilege('anon','public.fanart_recovery_state','SELECT')
              or has_table_privilege('authenticated','public.fanart_recovery_notifications','INSERT') then
              raise exception 'public access regression';
            end if;
            if (select count(*) from pg_class where relname in ('fanart_recovery_state','fanart_recovery_notifications') and relrowsecurity) <> 2 then
              raise exception 'missing RLS';
            end if;
            insert into public.fanart_recovery_notifications(batch_date,phase,outcome,delivery) values ('2026-10-10','initial','waiting','sending');
            insert into public.fanart_recovery_notifications(batch_date,phase,outcome,delivery) values ('2026-10-10','initial','waiting','sending') on conflict do nothing;
            get diagnostics n = row_count;
            if n <> 0 then raise exception 'duplicate claim'; end if;
            update public.fanart_recovery_notifications set delivery='failed' where phase='initial';
            update public.fanart_recovery_notifications set delivery='sending',attempt=2 where phase='initial' and delivery='failed' and attempt=1;
            get diagnostics n = row_count;
            if n <> 1 then raise exception 'retry claim missing'; end if;
            update public.fanart_recovery_notifications set delivery='sending',attempt=2 where phase='initial' and delivery='failed' and attempt=1;
            get diagnostics n = row_count;
            if n <> 0 then raise exception 'duplicate retry claim'; end if;
            insert into public.fanart_recovery_notifications(batch_date,phase,outcome,delivery) values ('2026-10-10','final','success','sending');
          end $$;
          SQL
