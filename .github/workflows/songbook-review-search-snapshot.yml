name: Songbook review search snapshot
on:
  push:
    branches: [feature/songbook-review-search]
    paths: ['.github/workflows/songbook-review-search-snapshot.yml']
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: |
          mkdir -p source-snapshot
          git status --short
          git rev-parse HEAD > source-snapshot/source-sha.txt
          git archive HEAD -o source-snapshot/repository.tar
      - uses: actions/upload-artifact@v4
        with:
          name: songbook-review-search-source
          path: source-snapshot/
          retention-days: 3
