name: Account password verification
on:
  push:
    branches: [develop]
    paths: ['src/pages/AccountPage.jsx', 'src/components/PasswordChangeForm.jsx', 'src/lib/passwordChange.js', 'supabase/functions/member-password/**', 'supabase/functions/_shared/password-policy.mjs', 'tests/password-change.test.js', 'scripts/password-change-browser-check.py', '.github/workflows/password-change-verify.yml']
  pull_request:
    branches: [main, develop]
    paths: ['src/pages/AccountPage.jsx', 'src/components/PasswordChangeForm.jsx', 'src/lib/passwordChange.js', 'supabase/functions/member-password/**', 'supabase/functions/_shared/password-policy.mjs', 'tests/password-change.test.js', 'scripts/password-change-browser-check.py', '.github/workflows/password-change-verify.yml']
permissions:
  contents: read
jobs:
  password-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VITE_SUPABASE_URL: https://preview-fixture.supabase.co
      VITE_SUPABASE_ANON_KEY: local-fixture-public-key
      VITE_REVIEW_PREVIEW: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify source and isolated server behavior
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run verify
      - name: Install browser test tools
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Desktop and mobile password-change regression
        run: |
          npm run preview -- --host 127.0.0.1 > /tmp/password-preview.log 2>&1 &
          for n in $(seq 1 30); do curl -fsS http://127.0.0.1:4173/ >/dev/null && break || sleep 1; done
          python scripts/password-change-browser-check.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: account-password-review
          path: password-ui-report/
          retention-days: 14
