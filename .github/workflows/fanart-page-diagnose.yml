name: Fanart public page diagnosis
on:
  push:
    branches: [develop]
    paths: ['.github/workflows/fanart-page-diagnose.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install ordinary browser tools
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Observe the public article data request including its iframe
        run: |
          mkdir -p fanart-page-diagnosis
          python - <<'PY'
          import json
          from pathlib import Path
          from urllib.parse import urlsplit,parse_qs
          from playwright.sync_api import sync_playwright
          results=[]; denied=[]
          with sync_playwright() as p:
              browser=p.chromium.launch()
              try:
                  context=browser.new_context()
                  def route(r):
                      if denied or r.request.method not in ['GET','HEAD','OPTIONS']: return r.abort()
                      return r.continue_()
                  context.route('**/*',route)
                  def response(r):
                      if r.request.resource_type not in ['xhr','fetch']: return
                      u=urlsplit(r.url)
                      # Only host/path and non-sensitive article query values, no headers/tokens.
                      query=parse_qs(u.query,keep_blank_values=True)
                      row={'host':u.hostname,'path':u.path,'query':{k:v if k.lower() in ['query','boardtype','usecafeid','requestfrom','menuid','requestsource','clubid','cafeid','articleid'] else '[omitted]' for k,v in query.items()},'status':r.status,'mime':r.headers.get('content-type')}
                      if 'naver' in (u.hostname or '') and r.status in [401,403,429]: denied.append(r.status)
                      if '165311' in u.path or 'articleapi' in u.path:
                          try:
                              x=r.json(); row['top_keys']=list(x) if isinstance(x,dict) else []
                              if isinstance(x,dict):
                                  x=x.get('result',x.get('message',{}).get('result',{}))
                                  row['result_keys']=list(x) if isinstance(x,dict) else []
                                  a=x.get('article',{})
                                  row['article_keys']=list(a) if isinstance(a,dict) else []
                                  row['title']=a.get('subject')
                          except Exception: pass
                      results.append(row)
                  context.on('response',response)
                  page=context.new_page()
                  page.goto('https://cafe.naver.com/f-e/cafes/31003156/articles/165311',wait_until='domcontentloaded',timeout=40000)
                  page.wait_for_timeout(7000)
                  frames=[{'url':f.url,'article_count':f.locator('.ArticleContentBox').count(),'image_count':f.locator('.se-main-container img').count()} for f in page.frames]
                  result={'requests':results,'frames':frames,'denied':denied}
                  Path('fanart-page-diagnosis/result.json').write_text(json.dumps(result,ensure_ascii=False,indent=2))
                  print(json.dumps(result,ensure_ascii=False))
              finally: browser.close()
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fanart-public-page-diagnosis
          path: fanart-page-diagnosis/
          retention-days: 7
