name: Deploy mir.yeop.net
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'package.json'
      - 'package-lock.json'
      - 'index.html'
      - 'vite.config.js'
      - 'server/**'
      - 'scripts/yeop_deploy_ci.py'
      - 'scripts/mir_deploy_ci.py'
      - 'scripts/mir_shared_root_deploy_ci.py'
      - 'scripts/mir_policy_deploy_ci.py'
      - 'scripts/policy-production-check.py'
      - 'scripts/prepare-public-build-config.sh'
      - 'scripts/generate-home-share-image.py'
      - 'scripts/verify-home-share-image.py'
      - '.github/workflows/deploy-yeop.yml'
      - 'deploy/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: yeop-production-deploy
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VITE_REVIEW_PREVIEW: 'false'
      VITE_POLICY_PREVIEW: 'false'
      VITE_SONGBOOK_PREVIEW: 'false'
      VITE_SONGBOOK_PLATFORM_PREVIEW: 'false'
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Require deployment secret
        env:
          YEOP_SFTP_PASSWORD: ${{ secrets.YEOP_SFTP_PASSWORD }}
        run: test -n "$YEOP_SFTP_PASSWORD"
      - name: Generate release ID
        run: |
          rid="r$(date -u +%Y%m%d%H%M%S)_${GITHUB_SHA:0:8}"
          echo "RELEASE_ID=$rid" >> "$GITHUB_ENV"
          echo "Release: $rid"
      - name: Prepare verified public Supabase build config
        env:
          SUPABASE_URL_SECRET: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_ANON_KEY_SECRET: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: bash scripts/prepare-public-build-config.sh
      - name: Install and verify frontend dependencies
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run verify
      - name: Stamp release marker
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          p=Path('index.html'); text=p.read_text(encoding='utf-8')
          marker='<meta name="yeop-release" content="'+os.environ['RELEASE_ID']+'" />'
          assert text.count('</head>') == 1
          p.write_text(text.replace('</head>',marker+'\n</head>'),encoding='utf-8')
          PY
      - name: Build release
        run: npx vite build --base "/_yeop_releases/${RELEASE_ID}/"
      - name: Install browser and SFTP tooling
        run: |
          python -m pip install --disable-pip-version-check --no-input playwright==1.57.0 paramiko==5.0.0
          python -m playwright install --with-deps chromium
      - name: Generate current home sharing thumbnail
        run: python scripts/generate-home-share-image.py --asset-base "/_yeop_releases/${RELEASE_ID}/"
      - name: Verify build contents
        run: |
          python - <<'PY'
          from pathlib import Path
          dist=Path('dist')
          for route in ['index.html','policies/privacy/index.html','policies/terms/index.html','policies/operation/index.html']:
              assert (dist/route).is_file(),route
          assert (dist/'mir-profile-live.gif').read_bytes()[:6] in (b'GIF87a',b'GIF89a')
          configured=False
          for p in dist.rglob('*'):
              if not p.is_file(): continue
              data=p.read_bytes()
              assert b'/.netlify/functions/' not in data,str(p)
              if p.suffix=='.js' and b'https://nohboljeugjmtwnvtayu.supabase.co' in data: configured=True
          assert configured,'Production public configuration missing'
          PY
      - name: Verify deployment syntax
        run: python -m py_compile scripts/yeop_deploy_ci.py scripts/mir_deploy_ci.py scripts/mir_shared_root_deploy_ci.py scripts/mir_policy_deploy_ci.py
      - name: Deploy, verify and activate with policy rollback checks
        env:
          ACTIVATE: 'true'
          DIST_DIR: dist
          SERVER_SOURCE_DIR: server
          YEOP_SFTP_PASSWORD: ${{ secrets.YEOP_SFTP_PASSWORD }}
          SONGBOOK_YOUTUBE_API_KEY: ${{ secrets.SONGBOOK_YOUTUBE_API_KEY }}
        run: python scripts/mir_policy_deploy_ci.py
      - name: Verify public sharing metadata and thumbnail
        run: python scripts/verify-home-share-image.py --expected-sha "$GITHUB_SHA"
      - name: Upload deployment report and rollback material
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yeop-deploy-${{ github.run_id }}
          path: |
            deploy_report.json
            platform-report/youtube-runtime.json
            deployment-backup/
            share-image-report/
            policy-live-report/
          if-no-files-found: ignore
          retention-days: 30
      - name: Deployment summary
        if: success()
        run: |
          echo "### mir.yeop.net production deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "Release: ${RELEASE_ID}" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit: ${GITHUB_SHA}" >> "$GITHUB_STEP_SUMMARY"
          echo "Published policies, signup notice and password-confirmed withdrawal UI. Original atomic routing and rollback engine preserved." >> "$GITHUB_STEP_SUMMARY"
