name: Songbook cafe audit
on:
  push:
    branches: [feature/songbook]
    paths: ['.github/workflows/songbook-cafe-audit.yml']
permissions:
  contents: read
jobs:
  public-search:
    if: github.ref == 'refs/heads/feature/songbook'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Inspect anonymous cafe search without authentication or writes
        run: |
          mkdir -p cafe-audit
          python - <<'PY'
          import json
          from pathlib import Path
          from urllib.parse import quote
          from playwright.sync_api import sync_playwright
          targets = [('original', 'https://meloming.com/channel/mir/musicbook')]
          for term in ['노래책', '세트리스트', '노래']:
              targets.append((term, 'https://cafe.naver.com/f-e/cafes/31003156/menus/0?viewType=L&ta=ARTICLE_COMMENT&page=1&q=' + quote(term)))
          with sync_playwright() as p:
              browser = p.chromium.launch()
              page = browser.new_page()
              for key, url in targets:
                  try:
                      response = page.goto(url, wait_until='domcontentloaded', timeout=45000)
                      page.wait_for_timeout(5000)
                      text = page.locator('body').inner_text()
                      links = page.locator('a[href]').evaluate_all('(els) => els.map(e => ({text:e.innerText,url:e.href}))')
                      report = {'sourceUrl': url, 'finalUrl': page.url, 'status': response.status if response else None, 'text': text, 'links': links}
                      Path('cafe-audit/' + key + '.json').write_text(json.dumps(report, ensure_ascii=False, indent=2), encoding='utf-8')
                      print('SOURCE', key, page.url, report['status'])
                      print(text[:10000])
                      print('LINKS', json.dumps(links[-25:], ensure_ascii=False))
                  except Exception as error:
                      print('UNAVAILABLE', key, type(error).__name__, str(error)[:250])
              browser.close()
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: songbook-cafe-audit
          path: cafe-audit/
          retention-days: 7
