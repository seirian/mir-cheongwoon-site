name: Songbook admin finalize
on:
  push:
    branches: [develop]
    paths: ['.github/workflows/songbook-admin-finalize.yml']
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply tested source edits only when preimages match
        run: |
          python - <<'PY'
          import base64,gzip,json,hashlib
          from pathlib import Path
          encoded=''
          changes=json.loads(gzip.decompress(base64.b64decode(encoded)))
          prepared=[]
          for change in changes:
              path=Path(change['path'])
              assert not path.is_absolute() and '..' not in path.parts
              before=path.read_text() if path.exists() else ''
              assert hashlib.sha256(before.encode()).hexdigest()==change['before'], path
              after=before
              for start,end,text in reversed(change['edits']): after=after[:start]+text+after[end:]
              assert hashlib.sha256(after.encode()).hexdigest()==change['after'], path
              prepared.append((path,after))
          for path,after in prepared:
              path.parent.mkdir(parents=True,exist_ok=True);path.write_text(after)
          PY
          npm ci --ignore-scripts --no-audit --no-fund
          npm run verify
          npm run check:backend
          git diff --check
      - name: Commit once to develop without touching production
        run: |
          git fetch origin develop
          test "$(git rev-parse HEAD)" = "$(git rev-parse FETCH_HEAD)"
          rm .github/workflows/songbook-admin-finalize.yml .github/workflows/songbook-work-snapshot.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/lib/songbookAccess.js src/lib/songbookStore.js src/pages/SongbookV2Page.jsx src/components/songbook/SongEditor.jsx tests/songbook-admin-access.test.js tests/songbook-shared-login-ui.test.js tests/sql/songbook-admin-bootstrap.sql tests/sql/songbook-admin-assertions.sql supabase/ops/songbook_admin_access.sql scripts/songbook-live-check.py scripts/songbook-production-browser-check.py .github/workflows/songbook-production-verify.yml .github/workflows/songbook-admin-finalize.yml .github/workflows/songbook-work-snapshot.yml
          git commit -m 'fix(songbook): remove redundant controls and use existing site administrator access'
          git push origin HEAD:develop
