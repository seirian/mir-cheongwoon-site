name: Fanart daily fallback verification
on:
  push:
    branches: [develop]
    paths: ['.github/workflows/fanart-daily-verify.yml', 'server/api/**', 'scripts/fanart-daily-*', 'src/lib/fanart*', 'src/components/FanartSlideshow.jsx', 'src/pages/SchedulePage.jsx', 'scripts/*deploy_ci.py']
  pull_request:
    branches: [main]
  workflow_run:
    workflows: ['Deploy mir.yeop.net']
    types: [completed]
    branches: [main]
permissions:
  contents: read
jobs:
  regression:
    if: github.event_name != 'workflow_run'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VITE_SUPABASE_URL: https://preview-fixture.supabase.co
      VITE_SUPABASE_ANON_KEY: local-fixture-public-key
      VITE_REVIEW_PREVIEW: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Source, cache and daily snapshot regression
        run: |
          sudo apt-get update -qq && sudo apt-get install -y php-cli php-curl
          npm ci --ignore-scripts --no-audit --no-fund
          npm run verify
          npm run check:backend
          php scripts/fanart-php-check.php
          php scripts/fanart-daily-check.php
          python scripts/fanart-deploy-check.py
          python scripts/fanart-daily-deploy-check.py
      - name: Install isolated browser
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Main failure to real PHP daily backup, desktop and mobile
        run: |
          npm run preview -- --host 127.0.0.1 > /tmp/daily-preview.log 2>&1 &
          for n in $(seq 1 30); do curl -fsS http://127.0.0.1:4173/ >/dev/null && break || sleep 1; done
          python scripts/fanart-daily-browser-check.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fanart-daily-regression
          path: daily-review/
          retention-days: 14
  live:
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install browser
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Check real saved backup without changing production or submitting credentials
        run: python scripts/fanart-daily-live-check.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fanart-daily-live
          path: daily-live-review/
          retention-days: 14
