name: Songbook source audit

on:
  push:
    branches: [feature/songbook]
    paths: ['.github/workflows/songbook-source-audit.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sources:
    if: github.ref == 'refs/heads/feature/songbook'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Read public songbook sources without login or writes
        run: |
          mkdir -p source-audit
          git archive --format=tar HEAD -o source-audit/repository.tar
          python - <<'PY'
          import json
          from pathlib import Path
          from playwright.sync_api import sync_playwright
          sources = [('silver', 'https://mir427.vercel.app/songs'), ('gurmir', 'https://gurmir.com/songbook'), ('cafe', 'https://cafe.naver.com/alice427')]
          with sync_playwright() as p:
              browser = p.chromium.launch()
              page = browser.new_page(viewport={'width': 1440, 'height': 1000})
              for key, url in sources:
                  try:
                      page.goto(url, wait_until='domcontentloaded', timeout=60000)
                      page.wait_for_timeout(7000)
                      root = Path('source-audit')
                      text = page.locator('body').inner_text()
                      links = page.locator('a[href]').evaluate_all('(els) => els.map(e => ({text:e.innerText,url:e.href}))')
                      html = page.content()
                      (root / (key + '.html')).write_text(html, encoding='utf-8')
                      (root / (key + '.json')).write_text(json.dumps({'url': page.url, 'text': text, 'links': links}, ensure_ascii=False, indent=2), encoding='utf-8')
                      print('SOURCE', key, page.url, 'TEXT_LENGTH', len(text), 'LINKS', len(links))
                      print(text[:16000])
                      print('SAMPLE LINKS', json.dumps(links[:15], ensure_ascii=False))
                      if key == 'silver':
                          details = [link['url'] for link in links if '/songs/' in link['url']]
                          for index, detail in enumerate(details[:2]):
                              page.goto(detail, wait_until='domcontentloaded', timeout=30000)
                              page.wait_for_timeout(3000)
                              (root / ('detail-' + str(index) + '.html')).write_text(page.content(), encoding='utf-8')
                              print('DETAIL', detail, page.locator('body').inner_text()[:10000])
                  except Exception as error:
                      print('SOURCE UNAVAILABLE', key, type(error).__name__, str(error)[:300])
              browser.close()
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: songbook-source-audit
          path: source-audit/
          retention-days: 7
