name: Songbook preview
on:
  push:
    branches: [feature/songbook]
    paths: ['src/**','scripts/**','tests/**','server/**','package.json','.github/workflows/songbook-preview.yml','docs/reviews/songbook*.md']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: songbook-preview
  cancel-in-progress: false
jobs:
  snapshot:
    if: github.ref == 'refs/heads/feature/songbook'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      commit: ${{ steps.source.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Finalize public catalog and integration source
        id: source
        run: |
          node scripts/finalize-songbook-v3.mjs
          node scripts/prepare-songbook-v2.mjs
          if [ -n "$(git status --porcelain)" ]; then
            git fetch origin feature/songbook
            test "$(git rev-parse FETCH_HEAD)" = "$(git rev-parse HEAD)"
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add src package.json scripts/songbook-v2-browser-check.py
            git commit -m 'chore(songbook): finalize revision three media and catalog integration'
            git push origin HEAD:feature/songbook
          fi
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  review:
    if: github.ref == 'refs/heads/feature/songbook'
    needs: snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SOURCE_COMMIT: ${{ needs.snapshot.outputs.commit }}
      VITE_REVIEW_PREVIEW: 'true'
      VITE_SONGBOOK_PREVIEW: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.snapshot.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify source and search parser
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run verify
          npm run check:backend
          php tests/songbook-search-test.php
      - name: Browser dependencies
        run: |
          python -m pip install playwright==1.57.0 paramiko==5.0.0
          if ! command -v google-chrome && ! command -v chromium; then python -m playwright install --with-deps chromium; fi
      - name: Local browser regression tests
        run: |
          npm run dev -- --host 127.0.0.1 > /tmp/songbook-vite.log 2>&1 &
          for n in $(seq 1 30); do curl -fsS http://127.0.0.1:5173/ >/dev/null && break || sleep 1; done
          python scripts/songbook-v3-browser-check.py --url http://127.0.0.1:5173/ --out songbook-local-report
      - name: Existing public build configuration
        env:
          SUPABASE_URL_SECRET: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_ANON_KEY_SECRET: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: bash scripts/prepare-public-build-config.sh
      - name: Build isolated noindex release and audit bundle
        run: |
          rid="r$(date -u +%Y%m%d%H%M%S)_${SOURCE_COMMIT:0:8}"
          echo "RELEASE_ID=$rid" >> "$GITHUB_ENV"
          npx vite build --base "/_yeop_releases/${rid}/"
          RELEASE_ID="$rid" python - <<'PY'
          import os
          from pathlib import Path
          marker = '<meta name="yeop-release" content="' + os.environ['RELEASE_ID'] + '" />'
          for path in Path('dist').rglob('*.html'):
              text=path.read_text();assert text.count('</head>')==1 and 'noindex, nofollow' in text
              path.write_text(text.replace('</head>',marker+'\n</head>'))
          for path in Path('dist').rglob('*'):
              if path.suffix in ('.js','.json','.html'):
                  text=path.read_text()
                  for value in ['gurmir.com','mir427.vercel.app','originalProficiency','미르실버타운']:
                      assert value not in text,(path,value)
          PY
      - name: Stage only without production activation
        env:
          YEOP_SFTP_PASSWORD: ${{ secrets.YEOP_SFTP_PASSWORD }}
          DIST_DIR: dist
          SERVER_SOURCE_DIR: server
        run: python scripts/stage-songbook-preview.py
      - name: Public browser and live catalog verification
        run: |
          python scripts/songbook-v3-browser-check.py --url "https://mir.yeop.net/_yeop_releases/${RELEASE_ID}/" --out songbook-live-report --live-catalog
          python - <<'PY'
          import json,urllib.request
          from pathlib import Path
          d=json.loads(Path('deploy_report.json').read_text());assert d['phase']=='staged' and d['production_routing_unchanged']
          result=[]
          for u in [d['songbook_url'],d['review_url']]:
              with urllib.request.urlopen(u,timeout=25) as r:
                  t=r.read().decode();assert r.status==200 and 'noindex, nofollow' in t;result.append({'url':u,'status':200})
          Path('songbook-http-report.json').write_text(json.dumps(result,indent=2))
          PY
      - name: Review artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: songbook-v3-review
          path: |
            songbook-local-report/
            songbook-live-report/
            deploy_report.json
            songbook-http-report.json
          retention-days: 14
