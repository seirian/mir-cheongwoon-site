name: Songbook v2 reference audit
on:
  push:
    branches: [feature/songbook]
    paths: ['.github/workflows/songbook-v2-audit.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Collect public read-only references and source archive
        run: |
          mkdir -p v2-audit
          git archive HEAD -o v2-audit/repository.tar
          python - <<'PY'
          import json, urllib.request, pathlib, concurrent.futures
          urls = ['https://onestage.kr/@gondra/musicbook', 'https://onestage.kr/@gondra/musicbook?page=2', 'https://onestage.kr/@mir/musicbook', 'https://onestage.kr/channels', 'https://onestage.kr/support/faq', 'https://onestage.kr/support/notices', 'https://meloming.com/channel/mir/musicbook', 'https://onestage.kr/']
          def fetch(pair):
              i,url=pair
              try:
                  req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 (compatible; SongbookReview/2.0)'})
                  with urllib.request.urlopen(req,timeout=25) as r: body=r.read(5000000); result={'url':url,'finalUrl':r.url,'status':r.status,'file':f'{i}.html'}
                  pathlib.Path('v2-audit',f'{i}.html').write_bytes(body)
              except Exception as e: result={'url':url,'error':str(e)}
              return result
          with concurrent.futures.ThreadPoolExecutor(max_workers=2) as pool: results=list(pool.map(fetch,enumerate(urls)))
          pathlib.Path('v2-audit/index.json').write_text(json.dumps(results,ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: songbook-v2-audit
          path: v2-audit/
          retention-days: 7
