name: Sharing thumbnail verification

on:
  push:
    branches: [develop]
    paths: ['scripts/*home-share-image.py', '.github/workflows/share-image-verify.yml', '.github/workflows/deploy-yeop.yml']
  pull_request:
    branches: [main, develop]
    paths: ['scripts/*home-share-image.py', '.github/workflows/share-image-verify.yml', '.github/workflows/deploy-yeop.yml']

permissions:
  contents: read

jobs:
  share-image:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VITE_SUPABASE_URL: https://preview-fixture.supabase.co
      VITE_SUPABASE_ANON_KEY: local-fixture-public-key
      VITE_REVIEW_PREVIEW: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Build isolated production-mode fixture
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx vite build --base /_yeop_releases/r20000101000000_12345678/
      - name: Install capture tools
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Capture current hero and verify failure isolation
        run: python scripts/check-home-share-image.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: share-image-regression
          path: share-regression-report/
          retention-days: 14
