name: Songbook rollout source snapshot
on:
  push:
    branches: [feature/songbook-platform-search]
    paths: ['.github/workflows/songbook-release-audit.yml']
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Archive reviewed code only, without secrets or build output
        run: |
          mkdir -p rollout-source
          git status --short
          git rev-parse HEAD > rollout-source/source-sha.txt
          git archive HEAD -o rollout-source/repository.tar
      - uses: actions/upload-artifact@v4
        with:
          name: songbook-rollout-source
          path: rollout-source/
          retention-days: 3
