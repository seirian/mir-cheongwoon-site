name: Finalize songbook release integration
on:
  push:
    branches: [feature/songbook]
    paths: ['.github/workflows/songbook-release-audit.yml','scripts/finalize-songbook-release.py']
permissions:
  contents: write
jobs:
  finalize:
    if: github.ref == 'refs/heads/feature/songbook'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Apply guarded integration and verify before commit
        run: |
          git status --short
          python scripts/finalize-songbook-release.py
          npm ci --ignore-scripts --no-audit --no-fund
          npm run verify
          npm run check:backend
          git fetch origin feature/songbook
          test "$(git rev-parse FETCH_HEAD)" = "$(git rev-parse HEAD)"
          git rm scripts/finalize-songbook-release.py .github/workflows/songbook-release-audit.yml
          git add src
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(songbook): integrate ID login, shared production session and isolated storage'
          git push origin HEAD:feature/songbook
          mkdir -p release-integration
          git rev-parse HEAD > release-integration/commit.txt
          git archive HEAD > release-integration/repository.tar
      - uses: actions/upload-artifact@v4
        with:
          name: songbook-release-integration
          path: release-integration/
          retention-days: 3
