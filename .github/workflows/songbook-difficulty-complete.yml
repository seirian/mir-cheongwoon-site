name: Songbook difficulty complete
on:
  push:
    branches: [develop]
    paths: ['.github/workflows/songbook-difficulty-complete.yml']
permissions:
  contents: read
  actions: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Complete public catalog pagination at bounded rate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 37130267803 --repo "$GITHUB_REPOSITORY" --name songbook-difficulty-audit --dir previous
          python -m pip install beautifulsoup4==4.13.4
          python -u - <<'PY'
          import json,time,re,math,hashlib,urllib.request,urllib.error,urllib.robotparser,collections
          from pathlib import Path
          from bs4 import BeautifulSoup
          old=Path('previous');out=Path('complete');out.mkdir();agent='MirSongbookReferenceReview/1.0'
          rows=json.loads((old/'ratings.json').read_text());catalogs=json.loads((old/'catalogs.json').read_text());stats=collections.defaultdict(collections.Counter)
          for r in rows:stats[r['catalog']][r['difficulty']]+=1
          qualified=[c for c in catalogs if c['eligible'] and stats[c['url']][1]/sum(stats[c['url']].values())<=.7]
          rp=urllib.robotparser.RobotFileParser();rp.parse((old/'robots.txt').read_text().splitlines());log=[];started=time.monotonic()
          try:
              for c in qualified:
                  c['completed_pages']=list(range(1,c['pages_read']+1))
                  for page in range(c['pages_read']+1,math.ceil(c['advertised']/40)+1):
                      url=c['url']+'?page='+str(page)
                      if len(log)>=400 or time.monotonic()-started>750:raise RuntimeError('budget reached')
                      if not rp.can_fetch(agent,url):raise RuntimeError('robots denied')
                      time.sleep(.4)
                      try:
                          with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':agent}),timeout=12) as response:body=response.read(8000000);status=response.status
                          if len(body)>=8000000:raise RuntimeError('oversize')
                          log.append({'url':url,'status':status,'sha256':hashlib.sha256(body).hexdigest()})
                      except urllib.error.HTTPError as e:
                          log.append({'url':url,'status':e.code})
                          if e.code in (403,429):raise RuntimeError('access limited; stop')
                          continue
                      except (TimeoutError,OSError) as e:
                          log.append({'url':url,'error':str(e)[:120]});continue
                      soup=BeautifulSoup(body,'html.parser');n=0
                      for card in soup.select('article[data-song-card]'):
                          t=card.select_one('.musicbook-song-title');a=card.select_one('.musicbook-song-artist');label=card.select_one('[aria-label^="난이도 "]')
                          rating=re.fullmatch(r'난이도 ([1-5])점',label.get('aria-label','')) if label else None
                          if not(t and a and rating):continue
                          for sr in t.select('.sr-only'):sr.decompose()
                          rows.append({'title':t.get_text(' ',strip=True),'artist':a.get_text(' ',strip=True),'difficulty':int(rating[1]),'url':c['url']+'#'+card.get('id',''),'catalog':c['url']});n+=1
                      c['completed_pages'].append(page)
                      print(c['url'],page,n,flush=True)
          except RuntimeError as e:(out/'stop.txt').write_text(str(e))
          finally:
              rows=list({r['url']:r for r in rows}.values())
              for name,value in [('ratings',rows),('catalogs',catalogs),('qualified',qualified),('requests',log)]:
                  (out/(name+'.json')).write_text(json.dumps(value,ensure_ascii=False,indent=2))
              print('rows',len(rows),'requests',len(log),flush=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: songbook-difficulty-complete
          path: complete/
          retention-days: 30
